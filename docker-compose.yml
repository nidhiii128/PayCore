services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paycore
      POSTGRES_USER: paycore
      POSTGRES_PASSWORD: paycore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paycore -d paycore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/paycore
      DATABASE_USERNAME: paycore
      DATABASE_PASSWORD: paycore
      REDIS_HOST: redis
      # Local development only. Generate a real one with: openssl rand -base64 48
      JWT_SECRET: local-dev-secret-local-dev-secret-local-dev
      # Lets you point webhooks at http://host.docker.internal while developing.
      WEBHOOKS_ALLOW_PRIVATE_HOSTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
